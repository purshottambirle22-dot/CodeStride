
name: CodeStride CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-build:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Backend Tests
        run: mvn -B test -Dtest="!DebugLiveTest"

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: codestride-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: codestride-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

  production-health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Wait for Render deployment
        run: sleep 90

      - name: Verify Production Readiness
        run: |
          for attempt in {1..30}; do
            response=$(curl --silent --show-error --fail \
              https://codestride.onrender.com/actuator/health/readiness) && {
              echo "$response"
              if echo "$response" | grep -q '"status":"UP"'; then
                echo "Production health check passed!"
                exit 0
              fi
            }

            echo "Attempt $attempt failed. Retrying in 20 seconds..."
            sleep 20
          done

          echo "Production health check failed!"
          exit 1
