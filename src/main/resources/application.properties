spring.application.name=codestride-backend

# Server Configuration (Render dynamic PORT & graceful shutdown)
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# MongoDB Configuration
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:codestride}
spring.data.mongodb.uri=${spring.mongodb.uri}
spring.data.mongodb.database=${spring.mongodb.database}
spring.data.mongodb.auto-index-creation=true

# Actuator Health Check Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# CORS Configuration (Production configurable via APP_CORS_ALLOWED_ORIGINS)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.refresh-expiration-ms=604800000
